name: Auction Monitor

on:
  # GitHub Actions 页面可以手动执行
  workflow_dispatch:

  # 每天北京时间 21:00 自动执行
  schedule:
    - cron: "0 21 * * *"
      timezone: "Asia/Shanghai"

jobs:
  monitor:
    name: Run Auction Monitor

    # GitHub 提供的 Ubuntu Runner
    runs-on: ubuntu-latest

    # 防止程序异常一直运行
    timeout-minutes: 30

    # 从 GitHub Repository Secrets 读取钉钉配置
    env:
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

    steps:
      # 1. 拉取项目代码
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. 安装 uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # 4. 安装 Python 项目依赖
      - name: Install dependencies
        run: uv sync

      # 5. 安装 Chromium + Linux 系统依赖
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # 6. 使用 Xvfb 虚拟显示器运行
      #    因为淘宝采集需要 headless=False
      - name: Run auction monitor
        run: xvfb-run -a uv run main.py